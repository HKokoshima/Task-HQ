<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📋 TASK HQ</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;padding:12px;font-size:13px}.form-box,.card{background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.hidden{display:none}.gridTop{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.gridMid,.gridMicro{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin-top:12px}.cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tag-study{background:#ffe5e5}.tag-client{background:#fff9d6}.tag-operation{background:#fff4cc}.tag-education{background:#e5f1ff}.tag-academic{background:#f0e5ff}.tag-private{background:#ffe5f2}.tag-nayuta{background:#e5fff4}.card{cursor:pointer;min-height:58px}.header{display:flex;justify-content:space-between;font-weight:bold}.priority-label{display:flex;align-items:center;gap:6px}.badge{color:#c00;font-weight:bold}.high{color:#c00;font-weight:bold}input,textarea,select{width:100%;padding:4px;box-sizing:border-box}button{padding:5px 10px}#deleteBtn{background:#c33;color:#fff;border:none}</style></head><body><h1>📋 TASK HQ</h1><button id='toggleBtn' onclick='toggleForm()'>➕ New Task</button> <button id='exportBtn'>📤 Export</button> <button id='importBtn'>📥 Import</button><input id='importFile' type='file' accept='.json' style='display:none'><div id='formWrap' class='form-box hidden'><h3 id='formTitle'>➕ New Task</h3><div class='gridTop'><div><label>Title<input id='title'></label></div><div><label>Tag<select id='tag' onchange='toggleMicroscopy()'><option>🔪 Study (Necropsy)</option><option>🔬 Study (Microscopy)</option><option>📝 Study (Report)</option><option>💌 Client Communication</option><option>⚙️ Operation</option><option>🎓 Education</option><option>📚 Academic (Research)</option><option>🏛️ Academic (Conferences)</option><option>🏠 Private</option><option>🐈 Nayuta</option></select></label></div><div><label>Status<select id='status'><option value='wait'>⏳ Wait</option><option value='ongoing'>🔄 Ongoing</option><option value='complete'>✅ Complete</option></select></label></div></div><div class='gridMid'><div><label>Due Date<input id='due' type='date'></label></div><div><label class='priority-label'><input id='priority' type='checkbox'>‼ HIGH PRIORITY</label></div></div><label>Description<textarea id='detail' rows='2'></textarea></label><div id='microscopyArea' class='hidden'><div class='gridMicro'><div><label>Total Slides<input id='totalSlides' type='number'></label></div><div><label>Reviewed Slides<input id='doneSlides' type='number' value='0'></label></div></div></div><button id='saveBtn' onclick='saveTask()'>Save</button><button id='deleteBtn' class='hidden' onclick='deleteCurrent()'>Delete</button></div><div class='section'><h2>📌 Today</h2><div id='today' class='cards3'></div></div><div class='section'><h2>📋 Active Tasks <select id="activeSort" onchange="render()" style="width:auto"><option value="priority">Priority</option><option value="category">Category</option></select></h2><div id='active' class='cards4'></div></div><div class='section'><h2 onclick='toggleCompleted()'>✅ Completed (<span id='ccount'>0</span>) <select id="completedSort" onclick="event.stopPropagation()" onchange="render()" style="width:auto"><option value="default">Default</option><option value="category">Category</option></select></h2><div id='completed' class='cards4 hidden'></div></div><script>function norm(s){s=String(s||'');if(s.includes('ongoing')||s.includes('Ongoing')||s.includes('🔄'))return'ongoing';if(s.includes('complete')||s.includes('Complete')||s.includes('✅'))return'complete';return'wait'}function icon(s){s=norm(s);return s==='ongoing'?'🔄':s==='complete'?'✅':'⏳'}let tasks=[];try{tasks=JSON.parse(localStorage.getItem('tasks_v03')||'[]')}catch(e){}tasks=tasks.map(t=>({...t,status:norm(t.status)}));let editId=null;function saveStore(){localStorage.setItem('tasks_v03',JSON.stringify(tasks));localStorage.setItem('tasks_v061',JSON.stringify(tasks));}function toggleForm(){const f=document.getElementById('formWrap');f.classList.toggle('hidden');document.getElementById('toggleBtn').textContent=f.classList.contains('hidden')?'➕ New Task':'➖ Close'}function toggleMicroscopy(){document.getElementById('microscopyArea').classList.toggle('hidden',!document.getElementById('tag').value.startsWith('🔬'))}function resetForm(){editId=null;formTitle.textContent='➕ New Task';saveBtn.textContent='Save';deleteBtn.classList.add('hidden');title.value='';detail.value='';due.value='';priority.checked=false;status.value='wait';}function saveTask(){const t={id:editId||Date.now(),title:title.value||'Untitled',detail:detail.value,tag:tag.value,status:status.value,due:due.value,priority:priority.checked,total:+totalSlides.value||0,done:+doneSlides.value||0};if(editId){tasks=tasks.map(x=>x.id===editId?t:x)}else tasks.push(t);saveStore();resetForm();render()}function editTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;if(formWrap.classList.contains('hidden'))toggleForm();editId=id;deleteBtn.classList.remove('hidden');formTitle.textContent='✏️ Edit Task';saveBtn.textContent='Update';title.value=t.title||'';detail.value=t.detail||'';tag.value=t.tag||'';status.value=norm(t.status);due.value=t.due||'';priority.checked=!!t.priority;totalSlides.value=t.total||'';doneSlides.value=t.done||0;toggleMicroscopy();formWrap.scrollIntoView({behavior:'smooth',block:'start'});}function deleteCurrent(){if(editId==null)return;tasks=tasks.filter(x=>x.id!==editId);saveStore();resetForm();render()}function card(t){let info='';if((t.tag||'').startsWith('🔬')&&t.total>0){let p=((t.done/t.total)*100||0).toFixed(1);info=p+'% | Rem '+(t.total-t.done);if(t.due)info+=' | Due '+t.due;}else if(t.priority){info='<span class="high">‼ HIGH</span>';if(t.due)info+=' | Due '+t.due;}else{info=t.due||'';}let cls='';if(t.tag.includes('Study')) cls='tag-study';else if(t.tag.includes('Client Communication')) cls='tag-client';else if(t.tag.includes('Operation')) cls='tag-operation';else if(t.tag.includes('Education')) cls='tag-education';else if(t.tag.includes('Academic')) cls='tag-academic';else if(t.tag.includes('Private')) cls='tag-private';else if(t.tag.includes('Nayuta')) cls='tag-nayuta';return `<div class="card ${cls}" onclick="editTask(${t.id})"><div class="header"><span>${(t.tag||'⚙️').split(' ')[0]} ${t.title||''}</span><span>${icon(t.status)}</span></div><div>${info}</div></div>`}function toggleCompleted(){completed.classList.toggle('hidden')}function render(){let th='',ah='',ch='',cc=0;const lim=new Date();lim.setDate(lim.getDate()+3);let activeTasks=tasks.filter(t=>norm(t.status)!=='complete');if(activeSort.value==='category'){activeTasks.sort((a,b)=>(a.tag||'').localeCompare(b.tag||''));}else{activeTasks.sort((a,b)=>{if(!!a.priority!==!!b.priority)return (b.priority?1:0)-(a.priority?1:0);const ad=a.due||'9999-12-31';const bd=b.due||'9999-12-31';return ad.localeCompare(bd);});}let completedTasks=tasks.filter(t=>norm(t.status)==='complete');if(completedSort.value==='category'){completedTasks.sort((a,b)=>(a.tag||'').localeCompare(b.tag||''));}activeTasks.forEach(t=>{const c=card(t);ah+=c;let todayFlag=!!t.priority;if(t.due){const d=new Date(t.due);if(d<=lim)todayFlag=true;}if(todayFlag)th+=c;});completedTasks.forEach(t=>{ch+=card(t);cc++;});today.innerHTML=th||'None';active.innerHTML=ah||'None';completed.innerHTML=ch||'None';ccount.textContent=cc;}render();document.getElementById('exportBtn').addEventListener('click',function(){const data=JSON.stringify(tasks,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TASK_HQ_backup.json';a.click();});document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(){try{const imported=JSON.parse(r.result);if(!Array.isArray(imported))throw new Error();tasks=imported;saveStore();render();alert('Import completed');}catch(err){alert('Invalid JSON file');}};r.readAsText(f);});</script></body></html>
